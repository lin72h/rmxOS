# Keep every accepted message, including devd and structured native telemetry.
? * store
# Keep repeated records intact in the text views as well as in the store.
= dup_delay 0
# FreeBSD's !-devd block applies only to these two text destinations.
? [! Sender devd] [= Level 7] file /var/log/debug.log format=bsd coalesce=0 mode=0600
? [! Sender devd] [= Facility daemon] [N<= Level 6] file /var/log/daemon.log format=bsd coalesce=0 mode=0600
