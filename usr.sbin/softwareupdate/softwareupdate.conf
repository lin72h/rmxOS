# No publication host is configured by default.
# Override in /etc/softwareupdate.conf, or pass --catalog DIR|URL.
catalog_url=""
# Boot environments (and their base snapshots) kept after a confirm; the
# running, fallback and bootfs environments are always kept.
retain=3
# Seconds of uptime the boot check waits before checking and confirming a
# newly staged environment, 0 to 600; this file and /etc/softwareupdate.conf
# must be owned by root and writable only by root.
confirm_delay=600
