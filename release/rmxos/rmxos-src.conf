# rmxOS base-release source policy.
# Consume this file for every world, kernel, installworld, installkernel,
# distribution, and package operation in the release profile.

# Kerberos and GSSAPI follow the upstream source defaults in this profile.
# Optional third-party packages may still carry their own dependencies.

# Keep ordinary OpenSSH and OpenSSL available for local administration and
# cryptography. These are explicit profile assertions, not global defaults.
WITH_OPENSSH=yes
WITH_OPENSSL=yes
