# rmxOS base-release make policy.
# Pair with rmxos-src.conf and sys/amd64/conf/RMXOS-RELEASE.

# Keep NFS-specific loadable modules out of the release. The ordinary
# sys/modules filter handles the direct modules; the dtrace makefile applies
# the same existing WITHOUT_MODULES selection to its nested dtnfscl child.
WITHOUT_MODULES+=nfscl nfscommon nfsd nfslockd nfssvc dtnfscl

# Keep the supported loader knob disabled where a loader honors it. This is
# not an exhaustive filesystem-content claim; dormant NFS userland remains.
LOADER_NFS_SUPPORT=no
